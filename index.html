<script type="text/plain" id="shipfn">function Nz([string]$s) { ($s.Normalize([Text.NormalizationForm]::FormKC) -replace '[ー―–—−‐]','-' -replace '\s','').ToLower() }
function Ship {
  param([string]$name, [string[]]$files)
  $user = "norinori-jan"
  $dest = Join-Path $env:USERPROFILE $name
  $roots = @("Downloads","iCloudDrive","Desktop","OneDrive") | ForEach-Object { Join-Path $env:USERPROFILE $_ } | Where-Object { Test-Path $_ }
  Write-Host "=== $name ==="
  $pool = foreach ($r in $roots) { Get-ChildItem $r -File -Recurse -Depth 2 -ErrorAction SilentlyContinue }
  $src = @{}
  foreach ($f in $files) {
    $b = [IO.Path]::GetFileNameWithoutExtension($f); $e = [IO.Path]::GetExtension($f)
    $pat = '^' + [regex]::Escape((Nz $name)) + '(-r\d+)?_*' + [regex]::Escape((Nz $b)) + '.*' + [regex]::Escape((Nz $e)) + '(\.txt)?$'
    $c = $pool | Where-Object { (Nz $_.Name) -match $pat } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
    if (-not $c) {
      Write-Host "NG: ${name}__$f が見つかりません"
      Write-Host "  探した場所: $($roots -join ', ')"
      $near = $pool | Where-Object { (Nz $_.Name).Contains((Nz $name)) } | Select-Object -First 8
      if ($near) { Write-Host "  近い名前のファイル:"; $near | ForEach-Object { Write-Host "    $($_.FullName)" } } else { Write-Host "  名前に $name を含むファイルが1つもありません" }
      return
    }
    Write-Host "  見つけた: $($c.FullName)"
    $src[$f] = $c
  }
  gh repo view "$user/$name" *> $null
  $exists = ($LASTEXITCODE -eq 0)
  New-Item -ItemType Directory -Force -Path $dest | Out-Null
  Set-Location $dest
  if (-not (Test-Path ".git")) {
    git init
    git branch -M main
    if ($exists) { git remote add origin "https://github.com/$user/$name.git"; git fetch origin; git reset origin/main; git checkout -- . }
  } elseif ($exists) { git pull --rebase }
  foreach ($f in $files) { Copy-Item $src[$f].FullName (Join-Path $dest $f) -Force }
  git add @files
  git diff --cached --quiet
  if ($LASTEXITCODE -eq 0) { Write-Host "$name : 変更なし（すでに反映済み）"; return }
  git commit -m "update $name"
  if (-not $exists) { gh repo create "$user/$name" --public --source . --remote origin }
  $br = (git rev-parse --abbrev-ref HEAD).Trim()
  git push -u origin $br
  if ($LASTEXITCODE -ne 0) { Write-Host "NG: $name の push に失敗しました（ブランチ: $br）"; return }
  gh api "repos/$user/$name/pages" *> $null
  if ($LASTEXITCODE -ne 0) { gh api -X POST "repos/$user/$name/pages" -f "source[branch]=$br" -f "source[path]=/" *> $null }
  Write-Host "完了: https://$user.github.io/$name/"
}
</script>

function syncCfg(){const g=k=>{try{return(localStorage.getItem(k)||'').trim()}catch(e){return''}};
 return{ep:(g('aidojo_sync_endpoint')||g('el_sync_endpoint')||g('qr_sync_endpoint')).replace(/\/$/,''),tk:g('aidojo_sync_token')||g('el_sync_token')||g('qr_sync_token')}}
const SECRET=/(sk-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|Bearer\s+[A-Za-z0-9._-]{20,}|[A-Fa-f0-9]{40,}|-----BEGIN)/;
async function aiReview(task,text){
 const c=syncCfg();if(!c.ep||!c.tk)throw new Error('設定が未入力です（下の「AI添削の設定」）');
 if(SECRET.test(text))throw new Error('キーやトークンらしい文字列が含まれています。伏せ字にしてから送ってください');
 const prompt='あなたはAIの頼み方を教える優しい先生です。次の「課題」に対する生徒の依頼文を添削してください。\n'
 +'観点：目的／材料／制約／出力形式。良い点を1つ、足りない点を最大3つ、改善した例文を1つ。日本語で、各項目は短く。\n\n課題：'+task+'\n\n生徒の依頼文：\n'+text;
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),45000);
 try{const r=await fetch(c.ep+'/ai',{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+c.tk},
  body:JSON.stringify({provider:'claude',model:'claude-sonnet-4-6',maxTokens:900,prompt})});
  if(r.status===401)throw new Error('トークンが違います');if(!r.ok)throw new Error('AI中継エラー '+r.status);
  const d=await r.json();return String(d&&d.text||'(空の返事)')}
 catch(e){throw (e&&e.name==='AbortError')?new Error('時間切れでした'):e}finally{clearTimeout(to)}}

const RULES=[
 ['single','HTML1ファイルで作る（外部ライブラリ・ビルドなし）',1,'HTML1ファイルで、外部ライブラリやビルド手順は使わない。'],
 ['iphone','iPhoneで使う（タップしやすい大きさ、ホーム画面追加に対応）',1,'iPhoneで使う。ボタンは指で押しやすい大きさにし、ホーム画面に追加して動くPWAにする（manifest・アイコン・Service Worker付き）。'],
 ['local','データは端末内に保存（外部送信しない）',1,'データは端末内にのみ保存し、勝手に外部へ送らない。'],
 ['keep','既存データ・既存機能を壊さない',1,'既存のデータ形式と既存機能は変えない。'],
 ['names','配布ファイル名は アプリ名__ファイル名',1,'配布ファイルは「アプリ名__ファイル名」（例 {app}__index.html）の名前で出す。'],
 ['steps','小さく作り、確認手順を添える',1,'まず骨組みだけ作り、動作確認の手順を添える。'],
 ['paste','コマンドはそのままコピペできる形（説明文・空欄なし）',1,'PowerShellのコマンドは、そのままコピペで動く形にする。説明文や<空欄>は入れない。'],
 ['secret','キー・トークンは貼らない／入力欄で扱う',1,'キーやトークンはコードに書かず、入力欄から自分で設定する設計にする。']
];
const MK=Object.assign({app:'',goal:'',feat:'',who:'自分（iPhone）',rules:RULES.filter(r=>r[2]).map(r=>r[0]),files:'index.html manifest.webmanifest icon.svg sw.js'},store.get('aidojo_mk',{}));
function buildPrompt(m){
 const app=(m.app||'(アプリ名)').trim();
 const lines=['【目的】',(m.goal||'(何を実現したいか)').trim(),'','【使う人・環境】',(m.who||'').trim()];
 if((m.feat||'').trim()){lines.push('','【入れたい機能】');m.feat.trim().split(/\n+/).forEach(x=>lines.push('・'+x.replace(/^[・\-\s]+/,'')))}
 lines.push('','【守るルール】');
 RULES.filter(r=>m.rules.includes(r[0])).forEach(r=>lines.push('・'+r[3].replace('{app}',app)));
 lines.push('','【出力形式】','・まず最初の段階（骨組み）だけ作る','・出来上がったファイルをダウンロードできる形で出す','・変更した点と確認手順を短く添える');
 return lines.join('\n')}
function buildShip(m){
 const app=(m.app||'').trim().replace(/[^A-Za-z0-9_-]/g,'-')||'my-app';
 const fl=(m.files||'index.html').trim().split(/[\s,]+/).filter(Boolean).map(f=>'"'+f.replace(/"/g,'')+'"').join(',');
 const fn=($('#shipfn')||{}).textContent||'';
 return fn.replace(/\s+$/,'')+'\nShip "'+app+'" @('+fl+')\n'}
function rMake(){
 const m=MK;
 $('#app').innerHTML=`<h1>作る</h1><p class="sub">ここまでの学びを使って、次のアプリを作る準備をします。①依頼文 → AIに貼る　②できたら配布コマンド → PowerShellに貼る</p>
 <div class="card"><b>① 依頼文をつくる</b>
 <p class="sub" style="margin:8px 0 4px">アプリ名（英数字とハイフン）</p><input id="mApp" placeholder="例：my-notes" value="">
 <p class="sub" style="margin:8px 0 4px">目的（何を実現したい？）</p><textarea id="mGoal" style="min-height:80px" placeholder="例：買い物メモを素早く残して、買ったら消せる"></textarea>
 <p class="sub" style="margin:8px 0 4px">入れたい機能（1行に1つ）</p><textarea id="mFeat" style="min-height:80px" placeholder="例：\n1行入力で追加\nチェックで完了\n完了を一括削除"></textarea>
 <p class="sub" style="margin:8px 0 4px">使う人・環境</p><input id="mWho">
 <p class="sub" style="margin:10px 0 2px">守るルール（あなたの流儀）</p><div id="mRules"></div></div>
 <div class="row"><button id="mGo">依頼文を作る</button><button class="g" id="mCp">コピー</button></div>
 <pre id="mOut" style="margin-top:8px" hidden></pre><div id="mChk"></div><div id="mMsg" class="msg"></div>
 <div class="card"><b>② 配布コマンドをつくる</b><p class="sub">アプリが出来て、ダウンロードに <code>アプリ名__ファイル名</code> が届いたら、これをPowerShellに1回貼るだけ。</p>
 <p class="sub" style="margin:8px 0 4px">ファイル（空白区切り）</p><input id="mFiles">
 <div class="row" style="margin-top:8px"><button id="sGo">コマンドを作る</button><button class="g" id="sCp">コピー</button></div><pre id="sOut" style="margin-top:8px;max-height:220px" hidden></pre></div>`;
 $('#mApp').value=m.app;$('#mGoal').value=m.goal;$('#mFeat').value=m.feat;$('#mWho').value=m.who;$('#mFiles').value=m.files;
 $('#mRules').innerHTML=RULES.map(r=>`<label class="chk"><input type="checkbox" data-k="${r[0]}" ${m.rules.includes(r[0])?'checked':''} style="width:22px;height:22px;flex:0 0 22px"><span>${esc(r[1])}</span></label>`).join('');
 const pull=()=>{m.app=$('#mApp').value;m.goal=$('#mGoal').value;m.feat=$('#mFeat').value;m.who=$('#mWho').value;m.files=$('#mFiles').value;
  m.rules=[...$('#mRules').querySelectorAll('input:checked')].map(x=>x.dataset.k);store.set('aidojo_mk',m)};
 let cur='';
 $('#mGo').onclick=()=>{pull();if(!m.goal.trim()){$('#mMsg').textContent='目的を1行書いてください';return}
  if(SECRET.test(m.goal+m.feat)){$('#mMsg').textContent='キーらしい文字列があります。伏せてください';return}
  cur=buildPrompt(m);$('#mOut').hidden=false;$('#mOut').textContent=cur;$('#mMsg').textContent='';
  const r=evalP(cur.replace(/【.*?】/g,''));$('#mChk').innerHTML='<div class="card">'+r.map(x=>`<div class="chk"><span>${x.ok?'✅':'⬜'}</span><span>${esc(x.l)}</span></div>`).join('')+'</div>'};
 $('#mCp').onclick=async()=>{if(!cur){$('#mMsg').textContent='先に「依頼文を作る」を押してください';return}try{await navigator.clipboard.writeText(cur);$('#mMsg').textContent='コピーしました。AIの入力欄に貼ってください'}catch(e){$('#mMsg').textContent='コピーできません。文字を長押しで選んでコピーしてください'}};
 let sh='';
 $('#sGo').onclick=()=>{pull();sh=buildShip(m);$('#sOut').hidden=false;$('#sOut').textContent=sh};
 $('#sCp').onclick=async()=>{pull();sh=buildShip(m);try{await navigator.clipboard.writeText(sh);$('#sOut').hidden=false;$('#sOut').textContent=sh;$('#mMsg').textContent='配布コマンドをコピーしました'}catch(e){$('#mMsg').textContent='コピーできませんでした'}};
 ['mApp','mGoal','mFeat','mWho','mFiles'].forEach(id=>$('#'+id).oninput=pull);
 $('#mRules').onchange=pull}

function rGl(){
 $('#app').innerHTML=`<h1>用語集</h1><p class="sub">会話で出てくる言葉を、短く。</p><input id="q" placeholder="検索"><dl class="gl" id="dl"></dl>`;
 const draw=()=>{const q=$('#q').value.trim().toLowerCase();$('#dl').innerHTML=G.filter(g=>!q||(g[0]+g[1]).toLowerCase().includes(q)).map(g=>`<dt>${esc(g[0])}</dt><dd>${esc(g[1])}</dd>`).join('')};
 $('#q').oninput=draw;draw()}

function rMe(){
 const nd=Object.keys(S.done).length,nq=Object.keys(S.quiz).length,np=Object.keys(S.prac).length;
 $('#app').innerHTML=`<h1>記録</h1><div class="card"><div>📘 レッスン完了 <b>${nd}</b> / ${L.length}</div><div>✅ クイズ正解 <b>${nq}</b> / ${L.length}</div><div>✍️ 練習クリア <b>${np}</b> / ${P.length}</div></div>
 <h2>つまずき・学びノート</h2><p class="sub">AIとのやり取りで「次は防ぎたい」と思ったことを残します（秘密は書かない）。</p>
 <textarea id="nt" style="min-height:90px" placeholder="例：同じ名前のファイルが混ざった → 名前に app名__ を付ける"></textarea>
 <div class="row" style="margin-top:8px"><button id="ad">追加</button><button class="g" id="cp">全部コピー</button></div><div id="mm" class="msg"></div><div id="nl"></div>`;
 const draw=()=>{$('#nl').innerHTML='';S.notes.forEach((n,i)=>{const d=document.createElement('div');d.className='note';const s=document.createElement('small');s.textContent=new Date(n.at).toLocaleDateString('ja-JP')+(n.from?'・'+n.from:'');
  const t=document.createElement('div');t.textContent=n.t;const x=document.createElement('button');x.className='g';x.textContent='削除';x.style.cssText='min-height:30px;padding:2px 10px;margin-top:6px;font-size:12px';
  x.onclick=()=>{if(confirm('削除しますか？')){S.notes.splice(i,1);save();draw()}};d.append(s,t,x);$('#nl').appendChild(d)})};
 $('#ad').onclick=()=>{const t=$('#nt').value.trim();if(!t)return;if(SECRET.test(t)){$('#mm').textContent='キーらしい文字列があります。伏せてください';return}
  S.notes.unshift({t,at:Date.now()});save();$('#nt').value='';$('#mm').textContent='追加しました';draw()};
 $('#cp').onclick=async()=>{const txt=S.notes.map(n=>'・'+n.t).join('\n')||'(まだありません)';try{await navigator.clipboard.writeText(txt);$('#mm').textContent='コピーしました'}catch(e){$('#mm').textContent='コピーできませんでした'}};
 draw()}

render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
